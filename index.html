<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- viewport-fit=cover so the installed app draws under the status bar instead of
         letting the system pad the page with a band of its own; src/index.css puts the
         safe-area insets back as padding. Honoured on iOS and in an Android browser
         tab; Chrome ignores it in an installed app, which keeps its own band above the
         viewport coloured from the manifest (see background_color in vite.config.ts) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2f6f4e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- iOS has no way to tint the status bar: either it reserves an opaque band, which
         it fills from the page background and so shows up as a white strip above the
         app bar, or the page draws behind it -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>iNat memorama</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
